<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background-color: blue;
        }
        @media print{

            }
            
        }

        @media(max-width: 600px){

        }

            color: var(--cor--texto);
        }

</head>
