<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala da comoda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">     
        <img style="width: 100%; height: 100%;" id="comoda" src="images/comodajogo.png" alt="Imagem do jogo" oncontextmenu="return false;">
        
        <h1 class="dicacenario">Não precisa de Chave!</h1>

        <img class="objeto" id="dicasteclado" src="images/puzzleB2/teclasdica.webp" onclick="pegarPapel()" alt="papel">
        <img src="images/gavetajogo.png" class="gaveta" onclick="abrirGaveta()" alt="">
        
        <button class="scenario-button backgame" type="button" aria-label="Cenário anterior" onclick="backGame()">&#8249;</button>
        <button class="inventario" type="button" aria-label="Inventário" onclick="inventario()">&#128736;</button>
        <button class="dicas"  type="button" aria-label="Dicas" onclick="dicas()">&#128161;</button>
    </div> 
    <script src="scripts/inventario.js"></script>
    <script src="scripts/comoda.js"></script>
    <script src="scripts/dicas.js"></script>

</body>
</html>
