<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala da Caixa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">     
        <img style="width: 100%; height: 100%;" id="comoda" src="images/caixademetal.png" alt="Imagem do jogo" oncontextmenu="return false;">
        
        <img id="btnvoa" style="z-index: 2; top: 40%; left: 49%; width: 142px; height: 98px;" src="images/botaodemetal.png" alt="botao" id="btn" class="objeto" onclick="liberarPapel()" oncontextmenu="return false;">
        <img id="pergaminho" style="z-index: 1; top: 42%; left: 50%; width: 112px; height: 68px;" src="images/pergaminho.webp" alt="botao" id="pergaminho" class="objeto" onclick="pegarPergaminho()" oncontextmenu="return false;">
        
        <h1 class="dicacenario">Alicate e Imã são úteis!</h1>
        
        
        <img id="correnteesquerda" src="images/corrente.png" class="corrente correnteesquerda" onclick="cortarCorrente()" alt="">
        <img id="correntedireita" src="images/corrente.png" class="corrente correntedireita" onclick="cortarCorrente()" alt="">

        <button class="scenario-button backgame" type="button" aria-label="Cenário anterior" onclick="backGame()">&#8249;</button>
        <button class="inventario" type="button" aria-label="Inventário" onclick="inventario()">&#128736;</button>
        <button class="dicas"  type="button" aria-label="Dicas" onclick="dicas()">&#128161;</button>
    </div> 
    <script src="scripts/inventario.js"></script>
    <script src="scripts/corrente.js"></script>
    <script src="scripts/dicas.js"></script>

</body>
</html>
