<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle B2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">     
        <img style="width: 100%; height: 100%;" id="comoda" src="images/puzzleB2/fundoB2.png" alt="Imagem do jogo" oncontextmenu="return false;">
        
        <img class="fios" id="fio1" src="images/puzzleB2/fios1B2.png" alt="">
        <img class="fios" id="fio2" src="images/puzzleB2/fios2B2.png" alt="">
        <img class="fios" id="fio3" src="images/puzzleB2/fios3B2.png" alt="">

        <img style="top: 16%; left: 47%; width: 60px; height: 60px;" src="images/puzzleB2/setaB2.png" alt="seta" id="seta" class="objeto rotatoria" oncontextmenu="return false;">
        <img style="opacity: 0; top: 16%; left: 47%; width: 80px; height: 80px;" src="images/ima.webp" alt="seta" id="ima" class="objeto" oncontextmenu="return false;">

        <button class="scenario-button backgame" type="button" aria-label="Cenário anterior" onclick="backGame()">&#8249;</button>
        <button class="inventario" type="button" aria-label="Inventário" onclick="inventario()">&#128736;</button>
        <button class="dicas"  type="button" aria-label="Dicas" onclick="dicas()">&#128161;</button>
        <h1 class="dicacenario">Use a sequencia de teclas correta...</h1>

    </div> 
    <script src="scripts/inventario.js"></script>
    <script src="scripts/puzzleB2.js"></script>
    <script src="scripts/dicas.js"></script>
</body>
</html>
