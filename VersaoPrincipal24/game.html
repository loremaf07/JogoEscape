<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        
        <div class="game-content" tabindex="0" aria-label="Cenários do jogo">
            <!--A-->
            <div class="scenario-slide">
                <img id="cenario1" src="images/cenario1.png" alt="Imagem do jogo">
                <div style="top: 66%; left: 19%; width: 250px; height: 200px;" class="scenario-square puzzle_A1" aria-hidden="true" onclick="darZoomNoObjeto('15%', '99%', 5)"></div>        
                <img style="top: 86%; left: 16%; width: 40px; height: 40px;" src="images/alicate.png" alt="alicate" id="alicate" class="objeto" oncontextmenu="return false;">
                <div class="scenario-square puzzle_A1" aria-hidden="true" onclick="darZoomNoObjeto('0%', '5%', 0)"></div>
            </div>
            <!--B-->
            <div class="scenario-slide">
                <img id="cenario2" src="images/cenario2.png" alt="Imagem do jogo">
                <div style="top: 11%; left: 48%; width: 250px; height: 200px;" class="scenario-square puzzle_B1" aria-hidden="true" onclick="darZoomNoObjeto('60%', '11%', 7)"></div>
                <div class="scenario-square puzzle_B1" aria-hidden="true" onclick="darZoomNoObjeto('100%', '50%', 1)"></div>
            </div>
            <!--C-->
            <div class="scenario-slide">
                <img id="cenario3" src="images/cenario3.png" alt="Imagem do jogo">
                <img id="moldura" src="images/molduramontanha.png" alt="Imagem do jogo">
                <img onClick="derrubar()" class="flores"  id="flores" src="images/flores.png" alt="Imagem do jogo">
                <div style="top: 63%; left: 71%; width: 280px; height: 200px;" class="scenario-square puzzle_C1" aria-hidden="true" onclick="darZoomNoObjeto('99%', '84%', 6)"></div>
                <div class="scenario-square puzzle_C1" aria-hidden="true" onclick="darZoomNoObjeto('55%', '70%', 2)"></div>
            </div>
            <!--D-->
            <div class="scenario-slide">
                <img id="cenario4" src="images/cenario4.png" alt="Imagem do jogo">
                <div class="scenario-square puzzle_D1" aria-hidden="true" onclick="darZoomNoObjeto('40%', '70%', 3)"></div>
                <div style="top: 50%; left: 74%; width: 150px; height: 100px;" class="scenario-square puzzle_D1" aria-hidden="true" onclick="darZoomNoObjeto('90%', '64%', 4)"></div>
            </div>
        </div>
        <button class="scenario-button scenario-previous" type="button" aria-label="Cenário anterior">&#8249;</button>
        <button class="scenario-button scenario-next" type="button" aria-label="Próximo cenário">&#8250;</button>
        <button class="scenario-button backgame" type="button" aria-label="Cenário anterior" onclick="voltarIndex()">&#8249;</button>

        <h1 class="dicacenario">Clique nos Itens!</h1>
        <button class="inventario" type="button" aria-label="Inventário" onclick="inventario()">&#128736;</button>
        <button class="dicas" type="button" aria-label="Dicas" onclick="dicas()">&#128161;</button>
        
        
    </div>
    <script src="scripts/inventario.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/dicas.js"></script>
</body>
</html>
